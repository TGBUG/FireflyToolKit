<!doctype html>
<html>
	<head>
		<meta charset="utf-8" />
		<meta name="robots" content="noindex" />
		<!-- JSON rather than YAML, so the schema check in the deploy workflow can read
		it with JSON.parse and needs no YAML parser. Sveltia requires this link tag to
		find a config that is not the default config.yml. -->
		<link href="./config.json" type="application/json" rel="cms-config-url" />
		<title>Content Manager</title>
	</head>
	<body>
		<!-- The bundle is served from this same directory rather than a CDN. It is
		2.1 MB, and every CDN we measured made the admin interface take about
		22 seconds to become usable from mainland China, during which it renders
		as an unstyled, inert page. -->
		<script src="./sveltia-cms.js"></script>
	</body>
</html>
