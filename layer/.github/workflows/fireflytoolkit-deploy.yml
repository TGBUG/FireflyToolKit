name: Build and Deploy

# Only master, deliberately.
#
# Sveltia's Editorial Workflow keeps every unpublished entry on its own cms/*
# branch behind a draft pull request, where required fields may still be empty.
# Firefly's schema declares `published` as a required date, so a draft that
# lacks it fails validation -- building those branches would mean a red build
# every time you save a draft. It also means a draft save costs no Actions
# minutes, which matters: the theme's own build.yml and deploy.yml each trigger
# on every push and together dwarf this workflow.
#
# Do not add `pull_request` or another branch here.
on:
  push:
    branches: [master]
  # Setup pushes the injected files before the VPS_* secrets exist, so the very
  # first run of this workflow always fails. This lets it be re-run once they
  # are set, without inventing an empty commit.
  workflow_dispatch:

# Write, because publishing the build means creating a release.
permissions:
  contents: write

concurrency:
  group: fireflytoolkit-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The theme's build reads git history for post dates.
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          # No version here: pnpm/action-setup reads `packageManager` from
          # package.json, so it follows the theme's own pin on updates.
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Before the build, so a config the theme no longer accepts is caught in
      # seconds rather than after a full build. Read-only and dependency-free:
      # it parses the theme's TypeScript by scanning it and reads config.json.
      - name: Check the CMS config against the theme's schema
        run: node .github/scripts/check-schema.mjs

      - name: Build
        run: pnpm run build
        env:
          # The theme's github-card generator queries the GitHub API for any
          # repository referenced in content as `::github{repo=...}`. Without a
          # token those calls are rate-limited; with one they are not. Posts that
          # do not use the directive make no calls at all.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Why a release asset rather than streaming the build to the server:
      #
      # Measured, the runner's own egress is fast (~5 MB/s) but the direct route
      # from a runner to a Hong Kong host is not -- 0.4 to 1.5 MB/s when it works
      # at all, and roughly one run in four instead collapses to ~30 KB/s and
      # takes ten minutes or dies. The same server pulls 3.2 MB/s from GitHub for
      # every request, so putting the bytes on GitHub and letting the server fetch
      # them moves the transfer onto the fast, stable path.
      #
      # It also removes the two failure modes that came with streaming: the
      # server no longer holds a credential (a signed release URL needs none),
      # and a transfer that fails now fails the step, because the SSH command's
      # exit status is the pull's exit status.
      - name: Publish the build and get a signed URL
        id: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          release="$(date -u +%Y%m%d%H%M%S)"
          tag="build-$release"
          bundle="$RUNNER_TEMP/dist.tar.gz"

          tar -czf "$bundle" -C dist .
          echo "packaged $(du -h "$bundle" | cut -f1)"

          gh release create "$tag" "$bundle" --title "$tag" --notes "automated build"

          # browser_download_url is the one that redirects. The API asset endpoint
          # streams the bytes instead, so it cannot be handed to the server.
          url="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" \
            --jq '.assets[0].browser_download_url')"
          signed="$(curl -sS -o /dev/null -D - -H "Authorization: Bearer $GH_TOKEN" "$url" \
            | sed -n 's/^[Ll]ocation: *//p' | tr -d '\r')"
          [ -n "$signed" ] || { echo "no signed URL came back" >&2; exit 1; }

          # The URL is unauthenticated for about forty minutes, so keep it out of
          # the log even though this job is the only reader.
          echo "::add-mask::$signed"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "signed=$signed" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

          # One asset per build; keep the two most recent and drop the rest, tags
          # included, so a private repo does not accumulate them forever.
          gh release list --limit 100 --json tagName --jq '.[2:] | .[].tagName' \
            | xargs -r -n1 gh release delete --yes --cleanup-tag || true

      - name: Deploy on the server
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_BASE: ${{ secrets.VPS_BASE }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          SIGNED: ${{ steps.publish.outputs.signed }}
          RELEASE: ${{ steps.publish.outputs.release }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          # ServerAliveInterval so a dead connection fails in a minute instead of
          # hanging until the job times out.
          ssh -i ~/.ssh/id_ed25519 \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=accept-new \
              -o ServerAliveInterval=15 \
              -o ServerAliveCountMax=4 \
              "$VPS_USER@$VPS_HOST" 'bash -s' <<REMOTE
          set -euo pipefail
          mkdir -p "$VPS_BASE/releases/$RELEASE"

          # The server fetches from GitHub's CDN, so --retry has something to
          # work with: the signed URL stays valid for around forty minutes.
          curl -fsSL --retry 3 --retry-delay 5 "$SIGNED" \
            | tar -xzf - -C "$VPS_BASE/releases/$RELEASE"

          bash "$VPS_BASE/release.sh" "$RELEASE"
          REMOTE
