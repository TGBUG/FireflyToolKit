name: Build and Deploy

# Only master, deliberately.
#
# Sveltia's Editorial Workflow keeps every unpublished entry on its own cms/*
# branch behind a draft pull request, where required fields may still be empty.
# Firefly's schema declares `published` as a required date, so a draft that
# lacks it fails validation -- building those branches would mean a red build
# every time you save a draft. It also means a draft save costs no Actions
# minutes, which matters: the theme's own build.yml and deploy.yml each trigger
# on every push and together dwarf this workflow.
#
# Do not add `pull_request` or another branch here.
on:
  push:
    branches: [master]
  # Setup pushes the injected files before the VPS_* secrets exist, so the very
  # first run of this workflow always fails. This lets it be re-run once they
  # are set, without inventing an empty commit.
  workflow_dispatch:

# Read-only, and `actions: read` has to be named explicitly: an explicit
# permissions block turns every scope it does not mention off.
permissions:
  contents: read
  actions: read

concurrency:
  group: fireflytoolkit-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The theme's build reads git history for post dates.
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          # No version here: pnpm/action-setup reads `packageManager` from
          # package.json, so it follows the theme's own pin on updates.
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Before the build, so a config the theme no longer accepts is caught in
      # seconds rather than after a full build. Read-only and dependency-free:
      # it parses the theme's TypeScript by scanning it and reads config.json.
      - name: Check the CMS config against the theme's schema
        run: node .github/scripts/check-schema.mjs

      - name: Build
        run: pnpm run build
        env:
          # The theme's github-card generator queries the GitHub API for any
          # repository referenced in content as `::github{repo=...}`. Without a
          # token those calls are rate-limited; with one they are not. Posts that
          # do not use the directive make no calls at all.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Why the build travels through GitHub instead of straight to the server:
      #
      # Measured, the runner's own egress is fast (~5 MB/s) but the direct route
      # from a runner to a Hong Kong host is not -- 0.4 to 1.5 MB/s when it works
      # at all, and roughly one run in four instead collapses to ~30 KB/s and
      # takes ten minutes or dies. The same server pulls 3.2 MB/s from GitHub for
      # every request, so parking the bytes on GitHub and letting the server fetch
      # them moves the transfer onto the fast, stable path.
      #
      # It also removes the two failure modes that came with streaming: the
      # server holds no credential, and a transfer that fails now fails the step,
      # because the SSH command's exit status is the transfer's exit status.
      #
      # A release asset would have been the obvious carrier, but it does not work
      # here: `browser_download_url` answers 404 for a private repository no
      # matter how the request is authenticated, measured with a bearer token and
      # with basic auth. An Actions artifact does redirect, and its URL is
      # short-lived -- which is fine, because the runner can mint a fresh one for
      # every attempt.
      - name: Package the build
        run: tar -czf "$RUNNER_TEMP/dist.tar.gz" -C dist .

      - name: Upload the build as an artifact
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: ${{ runner.temp }}/dist.tar.gz
          # Only the VPS needs it, and only in the next minute or two.
          retention-days: 1

      - name: Deploy on the server
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_BASE: ${{ secrets.VPS_BASE }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          RELEASE: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          # The artifact download answers 302 to a signed URL that expires
          # quickly, so it is minted fresh per attempt rather than once.
          mint() {
            curl -sS -o /dev/null -D - \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" \
              | sed -n 's/^[Ll]ocation: *//p' | tr -d '\r'
          }

          for attempt in 1 2 3; do
            signed="$(mint)"
            if [ -z "$signed" ]; then
              status="$(curl -sS -o /dev/null -w '%{http_code}' \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" || true)"
              echo "attempt $attempt: no Location header from the artifact API (HTTP $status)" >&2
              sleep 5
              continue
            fi
            echo "::add-mask::$signed"

            # ServerAliveInterval so a dead connection fails in a minute instead
            # of hanging until the job times out.
            if ssh -i ~/.ssh/id_ed25519 \
                 -o IdentitiesOnly=yes \
                 -o StrictHostKeyChecking=accept-new \
                 -o ServerAliveInterval=15 \
                 -o ServerAliveCountMax=4 \
                 "$VPS_USER@$VPS_HOST" 'bash -s' <<REMOTE
          set -euo pipefail
          release="$VPS_BASE/releases/$RELEASE"
          work="\$(mktemp -d)"
          trap 'rm -rf "\$work"' EXIT

          # Start clean, so a retry after a half-finished attempt cannot leave a
          # release containing a mixture of two transfers.
          rm -rf "\$release"
          mkdir -p "\$release"

          # The artifact is a zip wrapping the tarball. unzip is present on the
          # server; funzip and streaming into tar were not verified, so this
          # takes the two steps it can rely on.
          curl -fsSL --retry 3 --retry-delay 2 "$signed" -o "\$work/a.zip"
          unzip -q "\$work/a.zip" -d "\$work/x"
          tarball="\$(find "\$work/x" -name 'dist.tar.gz' -type f | head -n1)"
          [ -n "\$tarball" ] || { echo "the artifact had no dist.tar.gz" >&2; exit 1; }
          tar -xzf "\$tarball" -C "\$release"

          bash "$VPS_BASE/release.sh" "$RELEASE"
          REMOTE
            then
              echo "deployed release $RELEASE"
              exit 0
            fi
            echo "attempt $attempt failed; re-signing and retrying" >&2
            sleep 5
          done

          echo "deploy failed after 3 attempts" >&2
          exit 1
